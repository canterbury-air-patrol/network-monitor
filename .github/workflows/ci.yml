name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run tests in Docker
        run: docker compose up --build --exit-code-from test test

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  frontend-e2e:
    runs-on: ubuntu-latest
    # The visual regression baselines ([P12-02]) are pixel comparisons against
    # images committed to the repository, so the suite runs in the same image
    # that rendered them — the browser build and the fonts are both part of
    # what a screenshot is. `run-e2e.sh` runs it locally in this same image.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      # What tells the suite it is in the environment the baselines belong to
      PLAYWRIGHT_VISUAL: '1'
      # Kept beside the container tag above so the check below can compare them
      PLAYWRIGHT_VERSION: '1.62.1'
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
        working-directory: frontend
      - name: Check the runner image matches the pinned Playwright
        working-directory: frontend
        run: |
          pinned=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          if [ "$pinned" != "$PLAYWRIGHT_VERSION" ]; then
            echo "@playwright/test $pinned is pinned, but this job runs" >&2
            echo "mcr.microsoft.com/playwright:v$PLAYWRIGHT_VERSION." >&2
            echo "Update the container tag in this workflow, then re-take the" >&2
            echo "baselines: ./run-e2e.sh --project=visual --update-snapshots" >&2
            exit 1
          fi
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          # test-results carries the actual/diff images for a failed baseline,
          # which is the only way to see what moved from a CI log
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: npm audit --audit-level=high
        working-directory: frontend
